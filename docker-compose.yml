networks:
  frontend-net:
    driver: bridge
    name: aegis-frontend-net
  backend-net:
    driver: bridge
    internal: true
    name: aegis-backend-net

volumes:
  postgres-data:
    driver: local
  minio-data:
    driver: local
  broker-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

services:
  # --- Message Broker (Redpanda - Kafka API Compatible) ---
  broker:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.8
    container_name: aegis-broker
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=768M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://broker:9092
      - --set redpanda.default_topic_partitions=16
      - --set redpanda.auto_create_topics_enabled=true
    networks:
      - backend-net
    volumes:
      - broker-data:/var/lib/redpanda/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'HEALTHY' || exit 0"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: aegis
    networks:
      - backend-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis -d aegis"]
      interval: 5s
      timeout: 2s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: aegis-minio
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: aegisminio
      MINIO_ROOT_PASSWORD: aegisminio-secret
    volumes:
      - minio-data:/data
    networks:
      - backend-net
    deploy:
      resources:
        limits: { cpus: '1.0', memory: 512M }
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Ingestion API Service ---
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: aegis-api
    ports:
      - "8010:8000"
    environment:
      - SERVICE_NAME=aegis-ingest-api
      - KAFKA_BOOTSTRAP_SERVERS=broker:9092
      - KAFKA_NUM_PARTITIONS=16
      - DATABASE_URL=postgresql://aegis:aegis@postgres:5432/aegis
      - MINIO_ENDPOINT=minio:9000
    networks:
      - frontend-net
      - backend-net
    volumes:
      - ./data/storage:/app/data/storage
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 5s
      timeout: 2s
      retries: 3

  # --- Processing Worker Pool (Scale horizontally) ---
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    environment:
      - SERVICE_NAME=aegis-processor-worker
      - WORKER_ID=worker-01
      - KAFKA_BOOTSTRAP_SERVERS=broker:9092
      - DATABASE_URL=postgresql://aegis:aegis@postgres:5432/aegis
      - MINIO_ENDPOINT=minio:9000
    networks:
      - backend-net
    depends_on:
      broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M

  # --- Real-Time Operations Console ---
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: aegis-dashboard
    ports:
      - "8090:8080"
    environment:
      - API_URL=http://api:8000
      - PROMETHEUS_URL=http://prometheus:9090
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - api
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # --- Prometheus Observability Exporter ---
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: aegis-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9095:9090"
    networks:
      - frontend-net
      - backend-net
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # --- Grafana Dashboard Console ---
  grafana:
    image: grafana/grafana:11.0.0
    container_name: aegis-grafana
    ports:
      - "3010:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - frontend-net
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
